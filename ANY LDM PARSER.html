<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDM Parser - Multi-LDM Dual Flight Direction Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 6px;
        }

        h2 {
            margin-top: 0;
            color: #1a365d;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        select {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
        }

        textarea {
            width: 100%;
            height: 220px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2c5282;
        }

        button.clear-btn {
            background-color: #e53e3e;
        }

        button.clear-btn:hover {
            background-color: #c53030;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 2px solid #000;
            text-align: center;
            padding: 6px 8px;
            font-weight: bold;
            font-size: 13px;
        }

        th {
            background-color: #ffffff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LDM Data Extractor & Table Generator</h2>

    <!-- Flight Controls -->
    <div class="controls">
        <div class="control-group">
            <label for="directionRule">Flight Logic Setting:</label>
            <select id="directionRule">
                <option value="odd_arr">Odd Flight No = ARRIVAL | Even Flight No = DEPARTURE</option>
                <option value="even_arr">Even Flight No = ARRIVAL | Odd Flight No = DEPARTURE</option>
            </select>
        </div>

        <div class="control-group">
            <label for="currentMonthSelect">Current Operations Month:</label>
            <select id="currentMonthSelect">
                <option value="JAN">JAN</option>
                <option value="FEB">FEB</option>
                <option value="MAR">MAR</option>
                <option value="APR">APR</option>
                <option value="MAY">MAY</option>
                <option value="JUN">JUN</option>
                <option value="JUL">JUL</option>
                <option value="AUG">AUG</option>
                <option value="SEP">SEP</option>
                <option value="OCT">OCT</option>
                <option value="NOV">NOV</option>
                <option value="DEC">DEC</option>
            </select>
        </div>

        <div class="control-group">
            <label for="dateShift">Arrival Date Adjustment:</label>
            <select id="dateShift">
                <option value="1" selected>+1 Day (Overnight Flight Arrival)</option>
                <option value="0">Same Date (No Shift)</option>
                <option value="-1">-1 Day</option>
            </select>
        </div>
    </div>

    <label for="ldmInput"><strong>Paste Batch / Multiple LDM Text Here:</strong></label>
    <textarea id="ldmInput" placeholder="Paste multiple LDMs here (e.g. FZ563 31JUL, FZ564 01AUG, etc.)..."></textarea>
    
    <div class="btn-group">
        <button onclick="processBatchLDM()">Parse All & Add to Table</button>
        <button class="clear-btn" onclick="clearTable()">Clear Table</button>
    </div>

    <!-- Table Structure -->
    <table id="ldmTable">
        <thead>
            <tr>
                <th rowspan="3" style="vertical-align: middle; width: 90px;">DATE</th>
                <th rowspan="3" style="vertical-align: middle; width: 100px;">FLIGHT NO</th>
                <th rowspan="3" style="vertical-align: middle; width: 80px;">REG</th>
                <th colspan="4">ARRIVAL</th>
                <th colspan="4">DEPARTURE</th>
                <th rowspan="3" style="vertical-align: top; width: 60px;">TOTAL<br>FLT</th>
            </tr>
            <tr>
                <th colspan="3">PAX</th>
                <th rowspan="2" style="vertical-align: bottom;">CARGO<br>IN KG</th>
                <th colspan="3">PAX</th>
                <th rowspan="2" style="vertical-align: bottom;">CARGO<br>IN KG</th>
            </tr>
            <tr>
                <!-- Arrival PAX Sub-columns -->
                <th style="width: 35px;">J</th>
                <th style="width: 45px;">Y</th>
                <th style="width: 45px;">INF</th>
                <!-- Departure PAX Sub-columns -->
                <th style="width: 35px;">J</th>
                <th style="width: 45px;">Y</th>
                <th style="width: 45px;">INF</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic combined rows render here -->
        </tbody>
    </table>
</div>

<script>
let tableRecords = [];

// Initialize current month dropdown to actual system month on load
window.addEventListener('DOMContentLoaded', () => {
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const currentSystemMonth = months[new Date().getMonth()];
    const selectElem = document.getElementById("currentMonthSelect");
    if (selectElem) {
        selectElem.value = currentSystemMonth;
    }
});

// Helper function to shift date string formatted like "31JUL26" or "31JUL"
function shiftDateString(dateStr, offsetDays) {
    if (offsetDays === 0 || !dateStr || dateStr === "-") return dateStr;

    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const day = parseInt(dateStr.slice(0, 2), 10);
    const monthStr = dateStr.slice(2, 5).toUpperCase();
    const hasYear = dateStr.length >= 7;
    const year = hasYear ? parseInt("20" + dateStr.slice(5, 7), 10) : new Date().getFullYear();

    const monthIndex = months.indexOf(monthStr);
    if (monthIndex === -1 || isNaN(day) || isNaN(year)) return dateStr;

    // Create JavaScript Date object and adjust days across months/years
    const dateObj = new Date(year, monthIndex, day);
    dateObj.setDate(dateObj.getDate() + offsetDays);

    const newDay = dateObj.getDate().toString().padStart(2, '0');
    const newMonth = months[dateObj.getMonth()];
    const newYear = dateObj.getFullYear().toString().slice(-2);

    return hasYear ? `${newDay}${newMonth}${newYear}` : `${newDay}${newMonth}`;
}

function parseSingleLDM(text) {
    let fltDate = "-";
    let fltNo = "-";
    let carrierCode = "";
    let fltNumeric = 0;
    let regNo = "-";
    let jPax = 0;
    let yPax = 0;
    let infPax = 0;
    let cargoKg = 0;

    const selectedMonth = document.getElementById("currentMonthSelect").value;
    const currentYear = new Date().getFullYear().toString().slice(-2);
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    // 1. Extract Flight Number, Day of Month Date, and Aircraft Registration
    const fltHeaderMatch = text.match(/([A-Z0-9]{2,3})\s*(\d{3,4})\/(\d{1,2})\.([A-Z0-9]+)/i);
    
    if (fltHeaderMatch) {
        carrierCode = fltHeaderMatch[1].toUpperCase();
        fltNumeric = parseInt(fltHeaderMatch[2], 10);
        fltNo = carrierCode + fltNumeric;

        const rawDay = parseInt(fltHeaderMatch[3], 10);
        const dayStr = rawDay.toString().padStart(2, '0');
        
        let monthStr = selectedMonth;

        // Auto-detect Previous Month if flight day is end of month (e.g. 28, 30, 31) relative to current month start
        if (rawDay >= 28) {
            let currentMonthIdx = months.indexOf(selectedMonth);
            let prevMonthIdx = (currentMonthIdx - 1 + 12) % 12;
            monthStr = months[prevMonthIdx];
        }

        fltDate = `${dayStr}${monthStr}${currentYear}`;
        regNo = fltHeaderMatch[4].toUpperCase();
    } else {
        const fltOnlyMatch = text.match(/([A-Z0-9]{2,3})\s*(\d{3,4})/i);
        if (fltOnlyMatch) {
            carrierCode = fltOnlyMatch[1].toUpperCase();
            fltNumeric = parseInt(fltOnlyMatch[2], 10);
            fltNo = carrierCode + fltNumeric;
        }

        const explicitDateMatch = text.match(/(\d{1,2}[A-Z]{3}(?:\d{2})?)/i);
        if (explicitDateMatch) {
            fltDate = explicitDateMatch[1].toUpperCase();
            if (fltDate.length === 5) fltDate += currentYear;
        }
    }

    // 2. Extract PAX breakdown
    const paxBreakdownMatch = text.match(/-[A-Z]{3}\.(\d+)\/(\d+)\/(\d+)\/(\d+)/i) || 
                              text.match(/\.(\d+)\/(\d+)\/(\d+)\/(\d+)/);
    if (paxBreakdownMatch) {
        const male = parseInt(paxBreakdownMatch[1]) || 0;
        const female = parseInt(paxBreakdownMatch[2]) || 0;
        const child = parseInt(paxBreakdownMatch[3]) || 0;
        infPax = parseInt(paxBreakdownMatch[4]) || 0;
        yPax = male + female + child;
    } else {
        const totalPaxMatch = text.match(/PAX\/(\d+)/i);
        if (totalPaxMatch) yPax = parseInt(totalPaxMatch[1]) || 0;
    }

    const classSplitMatch = text.match(/C(\d+)\.?Y(\d+)/i);
    if (classSplitMatch) {
        jPax = parseInt(classSplitMatch[1]) || 0;
        yPax = parseInt(classSplitMatch[2]) || 0;
    }

    // 3. Extract Cargo Weight
    const cargoMatch = text.match(/(?:MCT\s+C|FRE|CARGO)\s*(\d+)/i);

    if (cargoMatch) {
        cargoKg = parseInt(cargoMatch[1]) || 0;
    } else {
        const ldmSummaryMatch = text.match(/\b[A-Z]{3}\s+C\s+(\d+)\b/i) || text.match(/\bC\s+(\d+)\b/i);

        if (ldmSummaryMatch) {
            cargoKg = parseInt(ldmSummaryMatch[1]) || 0;
        }
    }

    return {
        date: fltDate,
        fltNo: fltNo,
        carrier: carrierCode,
        fltNum: fltNumeric,
        reg: regNo,
        j: jPax,
        y: yPax,
        inf: infPax,
        cargo: cargoKg
    };
}

function processBatchLDM() {
    const rawText = document.getElementById("ldmInput").value;
    if (!rawText.trim()) {
        alert("Please paste LDM text into the box first.");
        return;
    }

    let ldmBlocks = [];
    const rawBlocks = rawText.split(/(?=--- Start of|\bLDM\b)/i);

    rawBlocks.forEach(block => {
        if (block.includes("LDM") || block.match(/[A-Z0-9]{2,3}\s*\d{3,4}\/\d{1,2}/i)) {
            ldmBlocks.push(block);
        }
    });

    if (ldmBlocks.length === 0) {
        ldmBlocks = [rawText];
    }

    const rule = document.getElementById("directionRule").value;
    const dateShiftDays = parseInt(document.getElementById("dateShift").value, 10);

    ldmBlocks.forEach(block => {
        const parsed = parseSingleLDM(block);
        if (parsed.fltNum === 0 && parsed.reg === "-") return;

        const isOdd = parsed.fltNum % 2 !== 0;
        let isArrival = (rule === "odd_arr") ? isOdd : !isOdd;

        if (isArrival && dateShiftDays !== 0) {
            parsed.date = shiftDateString(parsed.date, dateShiftDays);
        }

        let existingRecord = tableRecords.find(r => r.date === parsed.date && r.reg === parsed.reg);

        if (existingRecord) {
            if (isArrival) {
                existingRecord.arr = { j: parsed.j, y: parsed.y, inf: parsed.inf, cargo: parsed.cargo };
                existingRecord.arrFltNum = parsed.fltNum;
            } else {
                existingRecord.dep = { j: parsed.j, y: parsed.y, inf: parsed.inf, cargo: parsed.cargo };
                existingRecord.depFltNum = parsed.fltNum;
            }

            if (existingRecord.arrFltNum && existingRecord.depFltNum) {
                const arrNumStr = existingRecord.arrFltNum.toString();
                const depNumStr = existingRecord.depFltNum.toString();
                existingRecord.displayFltNo = `${parsed.carrier}${arrNumStr}/${depNumStr}`;
            }
        } else {
            let newRecord = {
                date: parsed.date,
                reg: parsed.reg,
                carrier: parsed.carrier,
                displayFltNo: parsed.fltNo,
                arrFltNum: isArrival ? parsed.fltNum : null,
                depFltNum: !isArrival ? parsed.fltNum : null,
                arr: isArrival ? { j: parsed.j, y: parsed.y, inf: parsed.inf, cargo: parsed.cargo } : null,
                dep: !isArrival ? { j: parsed.j, y: parsed.y, inf: parsed.inf, cargo: parsed.cargo } : null
            };
            tableRecords.push(newRecord);
        }
    });

    renderTable();
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    tableRecords.sort((a, b) => a.date.localeCompare(b.date));

    tableRecords.forEach(record => {
        const arr = record.arr || { j: "-", y: "-", inf: "-", cargo: "-" };
        const dep = record.dep || { j: "-", y: "-", inf: "-", cargo: "-" };

        const newRow = document.createElement("tr");
        newRow.innerHTML = `
            <td>${record.date}</td>
            <td>${record.displayFltNo}</td>
            <td>${record.reg}</td>
            <td>${arr.j}</td>
            <td>${arr.y}</td>
            <td>${arr.inf}</td>
            <td>${arr.cargo}</td>
            <td>${dep.j}</td>
            <td>${dep.y}</td>
            <td>${dep.inf}</td>
            <td>${dep.cargo}</td>
            <td>1</td>
        `;
        tbody.appendChild(newRow);
    });
}

function clearTable() {
    tableRecords = [];
    renderTable();
}
</script>

</body>
</html>
