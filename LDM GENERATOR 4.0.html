<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDM Generator | Multi-line Precision with JNG INT/DOM</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #0a0a0a; 
            color: #00ff41; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 1400px; 
            margin: auto; 
            background: #161616; 
            padding: 25px; 
            border: 1px solid #333; 
            border-radius: 6px; 
            box-shadow: 0 0 20px rgba(0,255,65,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5em;
            text-align: center;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 5px #00ff41;
        }
        .grid-3 { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 15px; 
        }
        textarea { 
            width: 100%; 
            height: 280px; 
            background: #000; 
            color: #00ff41; 
            border: 1px solid #00ff41; 
            padding: 12px; 
            font-family: 'Courier New', monospace;
            font-size: 12px; 
            line-height: 1.4; 
            resize: vertical;
            border-radius: 4px;
        }
        textarea:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
        }
        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }
        button { 
            flex-grow: 1; 
            padding: 15px; 
            background: #00ff41; 
            color: #000; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 1.1em; 
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        button:hover { 
            background: #fff; 
            color: #000; 
            box-shadow: 0 0 15px #fff;
        }
        label { 
            color: #888; 
            font-size: 11px; 
            margin-bottom: 6px; 
            display: block; 
            font-weight: bold; 
            letter-spacing: 0.5px;
        }
        
        /* MANUAL ADJUSTMENT PANEL */
        .manual-editor {
            margin-top: 20px;
            background: #0d1a0e;
            border: 1px solid #00ff41;
            padding: 15px 20px;
            border-radius: 4px;
            display: none;
        }
        .manual-editor h3 {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #fff;
            letter-spacing: 1px;
        }
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .pax-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .pax-input-group input {
            width: 70px;
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 6px 10px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
        }
        .pax-input-group input:focus {
            outline: none;
            background: #111;
            box-shadow: 0 0 5px #00ff41;
        }

        .results-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 900px) {
            .results-wrapper, .editor-grid {
                grid-template-columns: 1fr;
            }
        }
        .output-box { 
            background: #000; 
            padding: 20px; 
            border: 2px solid #00ff41; 
            white-space: pre-wrap; 
            font-size: 1.3em; 
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .table-box {
            background: #000;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 4px;
            display: none;
            overflow-x: auto;
        }
        .table-box h3 {
            margin-top: 0;
            font-size: 14px;
            color: #fff;
            border-bottom: 1px dashed #444;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        th, td {
            padding: 8px;
            border-bottom: 1px solid #222;
        }
        th {
            color: #888;
            border-bottom: 1px solid #00ff41;
        }
        .status-inc {
            color: #00ff41;
            font-weight: bold;
        }
        .status-exc {
            color: #ff4141;
        }
        .flight-info-banner {
            background: #1f241f;
            border: 1px solid #00ff41;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LDM GENERATOR WITH CONNECTING PAX PARSER</h1>

    <div class="grid-3">
        <div>
            <label>1. PASTE ARRIVAL LDM (DTR)</label>
            <textarea id="arrivalLDM" placeholder="Paste Arrival LDM here..."></textarea>
        </div>
        <div>
            <label>2. PASTE DEPARTURE LOADSHEET (TTL/JNG)</label>
            <textarea id="depLoadsheet" placeholder="Paste Departure Loadsheet here..."></textarea>
        </div>
        <div>
            <label>3. CONNECTING PASSENGER INFO (OPTIONAL)</label>
            <textarea id="connPaxInfo" placeholder="Paste Connecting Passenger list here...&#10;e.g.&#10;BANGKOK SUVARN TH 388 / 1105 17&#10;DAMMAM SA 349 / 800 10&#10;DUBAI AE EK 583 / 1"></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="autoGenerate()">SCAN & GENERATE LDM</button>
    </div>

    <!-- MANUAL ADJUSTMENT CONTROL PANEL -->
    <div id="manualEditor" class="manual-editor">
        <h3>AUTO-BALANCING MANUAL PAX ADJUSTMENTS</h3>
        <div class="editor-grid">
            <div>
                <label>JNG INT (J / Y / INF)</label>
                <div class="pax-input-group">
                    <input type="number" id="intJ" min="0" oninput="onPaxEdit('INT', 'J')" onblur="syncAllFields()"> /
                    <input type="number" id="intY" min="0" oninput="onPaxEdit('INT', 'Y')" onblur="syncAllFields()"> +
                    <input type="number" id="intI" min="0" oninput="onPaxEdit('INT', 'I')" onblur="syncAllFields()">
                </div>
            </div>
            <div>
                <label>JNG DOM (J / Y / INF)</label>
                <div class="pax-input-group">
                    <input type="number" id="domJ" min="0" oninput="onPaxEdit('DOM', 'J')" onblur="syncAllFields()"> /
                    <input type="number" id="domY" min="0" oninput="onPaxEdit('DOM', 'Y')" onblur="syncAllFields()"> +
                    <input type="number" id="domI" min="0" oninput="onPaxEdit('DOM', 'I')" onblur="syncAllFields()">
                </div>
            </div>
        </div>
    </div>

    <div class="results-wrapper">
        <div>
            <div id="output" class="output-box"></div>
        </div>
        <div>
            <div id="tableContainer" class="table-box">
                <div id="flightBanner" class="flight-info-banner"></div>
                <h3>CONNECTING PASSENGERS BREAKDOWN TABLE</h3>
                <table id="connTable">
                    <thead>
                        <tr>
                            <th>DEST</th>
                            <th>ISO</th>
                            <th>FLT</th>
                            <th>PAX</th>
                            <th>STATUS & REASON</th>
                        </tr>
                    </thead>
                    <tbody id="connTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const ALLOWED_ISO = ["SA", "OM", "IT", "GB", "CA", "AE", "KW", "QA"];

    // Global state to manage live passenger adjustments
    let currentData = {
        pla: 0, plu: 0, plun: 0,
        ttlJ: 0, ttlY: 0, ttlI: 0,
        dtrJ: 0, dtrY: 0, dtrI: 0,
        jngJ: 0, jngY: 0, jngI: 0,
        intJ: 0, intY: 0, intI: 0,
        domJ: 0, domY: 0, domI: 0,
        totalIntPax: 0, totalDomPax: 0,
        dtrC: 0, jngC: 0,
        isEvenFlight: false
    };

    function pad(num) {
        let n = parseInt(num) || 0;
        return n.toString().padStart(2, '0');
    }

    function extractFlightNumberFromArrival(text) {
        if (!text) return null;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let targetLine = lines[1] || lines[0] || "";
        
        const match = targetLine.match(/([A-Z0-9]{2,3})\s*(\d+)/i);
        if (match) {
            return parseInt(match[2], 10);
        }
        
        const fallbackMatch = text.match(/(?:BG|LDM\n[A-Z0-9]{2,3})\s*(\d+)/i);
        if (fallbackMatch) {
            return parseInt(fallbackMatch[1], 10);
        }

        return null;
    }

    function parseConnectingPax(text) {
        const lines = text.split('\n');
        const parsedRows = [];
        let totalIntPax = 0;

        const lineRegex = /^\s*([A-Z\s]+?)\s+([A-Z]{2})\s+(([A-Z0-9]{2,3})\s+)?(\d+)\s+([\/\w\s]*?)\s+(\d+)\s*$/i;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            if (trimmed.includes('CONNECTING PASSENGER') || 
                trimmed.includes('DESTINATION') || 
                trimmed.includes('TOTAL LCL') || 
                trimmed.includes('FLT-BG')) {
                return;
            }

            const match = trimmed.match(lineRegex);
            if (match) {
                const dest = match[1].trim();
                const iso = match[2].trim().toUpperCase();
                const middleCode = match[3] ? match[3].trim() : "";
                const flightNum = match[5].trim();
                const paxCount = parseInt(match[7], 10) || 0;

                let isIncluded = false;
                let reason = "";

                if (!ALLOWED_ISO.includes(iso)) {
                    reason = `ISO '${iso}' not in allowed list`;
                } else if (middleCode.length > 0) {
                    reason = `Excluded: Code '${middleCode}' between ISO & Flight`;
                } else {
                    isIncluded = true;
                    reason = "Included in JNG INT";
                    totalIntPax += paxCount;
                }

                parsedRows.push({
                    dest,
                    iso,
                    flt: flightNum,
                    pax: paxCount,
                    isIncluded,
                    reason
                });
            }
        });

        return { parsedRows, totalIntPax };
    }

    function autoGenerate() {
        const arrival = document.getElementById('arrivalLDM').value.toUpperCase();
        const departure = document.getElementById('depLoadsheet').value.toUpperCase();
        const connText = document.getElementById('connPaxInfo').value;

        // 1. FLIGHT NUMBER EVALUATION
        const flightNum = extractFlightNumberFromArrival(arrival);
        currentData.isEvenFlight = (flightNum !== null) ? (flightNum % 2 === 0) : false;

        // 2. WEIGHT CALCULATIONS
        currentData.plu = parseInt((departure.match(/TOTAL\s+TRAFFIC\s+LOAD\s+(\d+)/i) || [0,0])[1]);
        currentData.plun = parseInt((departure.match(/UNDERLOAD\s+BEFORE\s+LMC\s+(\d+)/i) || [0,0])[1]);
        currentData.pla = currentData.plu + currentData.plun;

        // 3. INFANT SCANNER
        function getInfant(text, isArrival) {
            const pattern = isArrival ? /-(?!CGP)[A-Z]{3}\.(\d+\/\d+\/\d+(?:\/\d+)?)/ : /-[A-Z]{3}\.(\d+\/\d+\/\d+(?:\/\d+)?)/;
            const match = text.match(pattern);
            if (match) {
                const parts = match[1].split('/');
                return parseInt(parts[parts.length - 1]) || 0; 
            }
            return 0;
        }

        // 4. PAX SCANNER
        function getPax(text, isArrival) {
            const pattern = isArrival ? /-(?!CGP)[A-Z]{3}[\s\S]*?\.PAX\/(\d+)\/(\d+)/ : /\.PAX\/(\d+)\/(\d+)/;
            const match = text.match(pattern);
            return match ? [parseInt(match[1]) || 0, parseInt(match[2]) || 0] : [0, 0];
        }

        const ttlPax = getPax(departure, false);
        currentData.ttlJ = ttlPax[0];
        currentData.ttlY = ttlPax[1];
        currentData.ttlI = getInfant(departure, false);

        const dtrPax = getPax(arrival, true);
        currentData.dtrJ = dtrPax[0];
        currentData.dtrY = dtrPax[1];
        currentData.dtrI = getInfant(arrival, true);

        // 5. CARGO
        const dtrCargoMatch = arrival.match(/(?!CGP)[A-Z]{3}\s+C\s+(\d+)/);
        currentData.dtrC = dtrCargoMatch ? parseInt(dtrCargoMatch[1]) : 0;

        const jngCargoMatch = departure.match(/SI\s+[A-Z]{3}\s+C\s+(\d+)/);
        currentData.jngC = jngCargoMatch ? parseInt(jngCargoMatch[1]) : 0;

        // 6. CALCULATE TOTAL AVAILABLE JNG PAX
        currentData.jngJ = Math.max(0, currentData.ttlJ - currentData.dtrJ);
        currentData.jngY = Math.max(0, currentData.ttlY - currentData.dtrY);
        currentData.jngI = Math.max(0, currentData.ttlI - currentData.dtrI);

        // 7. PARSE CONNECTING PAX
        const { parsedRows, totalIntPax } = parseConnectingPax(connText);

        // Default initial distribution
        currentData.intJ = 0;
        currentData.intY = totalIntPax;
        currentData.intI = 0;

        currentData.domJ = Math.max(0, currentData.jngJ - currentData.intJ);
        currentData.domY = Math.max(0, currentData.jngY - currentData.intY);
        currentData.domI = Math.max(0, currentData.jngI - currentData.intI);

        // Store and lock the total passenger counts
        currentData.totalIntPax = currentData.intJ + currentData.intY;
        currentData.totalDomPax = currentData.domJ + currentData.domY;

        // Render Table Breakdown
        const tbody = document.getElementById('connTableBody');
        tbody.innerHTML = '';

        if (parsedRows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#666;">No connecting passenger data parsed</td></tr>`;
        } else {
            parsedRows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.dest}</td>
                    <td>${row.iso}</td>
                    <td>${row.flt}</td>
                    <td>${row.pax}</td>
                    <td class="${row.isIncluded ? 'status-inc' : 'status-exc'}">${row.isIncluded ? '✓ ' : '✗ '}${row.reason}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Flight Banner Info
        const banner = document.getElementById('flightBanner');
        let statusMsg = flightNum !== null 
            ? `FLIGHT NO: BG${flightNum} (${currentData.isEvenFlight ? 'EVEN - JNG INT/DOM DISPLAYED' : 'ODD - JNG INT/DOM OMITTED'})`
            : `FLIGHT NO: NOT DETECTED FROM LDM 2ND LINE`;
        banner.innerHTML = `<span>${statusMsg}</span><span>PARSED INT PAX: ${totalIntPax}</span>`;

        // Update input controls & UI display
        syncAllFields();
        updateDisplay();

        // Show/Hide Manual Editor Panel based on Even Flight check
        const editor = document.getElementById('manualEditor');
        editor.style.display = currentData.isEvenFlight ? 'block' : 'none';

        document.getElementById('tableContainer').style.display = 'block';
    }

    function syncAllFields() {
        document.getElementById('intJ').value = currentData.intJ;
        document.getElementById('intY').value = currentData.intY;
        document.getElementById('intI').value = currentData.intI;

        document.getElementById('domJ').value = currentData.domJ;
        document.getElementById('domY').value = currentData.domY;
        document.getElementById('domI').value = currentData.domI;
    }

    // Prevents overwriting the field the user is actively typing into
    function syncLiveInputFields() {
        const active = document.activeElement;
        if (active !== document.getElementById('intJ')) document.getElementById('intJ').value = currentData.intJ;
        if (active !== document.getElementById('intY')) document.getElementById('intY').value = currentData.intY;
        if (active !== document.getElementById('intI')) document.getElementById('intI').value = currentData.intI;

        if (active !== document.getElementById('domJ')) document.getElementById('domJ').value = currentData.domJ;
        if (active !== document.getElementById('domY')) document.getElementById('domY').value = currentData.domY;
        if (active !== document.getElementById('domI')) document.getElementById('domI').value = currentData.domI;
    }

    // Handles live adjustments: 
    // JNG INT J <-> JNG DOM J auto-balances
    // JNG INT Y and JNG DOM Y adjust to keep totals intact
    function onPaxEdit(source, cls) {
        const inputId = source.toLowerCase() + cls;
        const val = parseInt(document.getElementById(inputId).value, 10);
        const num = isNaN(val) ? 0 : val;

        if (cls === 'I') {
            const totalInf = currentData.jngI;
            if (source === 'INT') {
                currentData.intI = Math.max(0, Math.min(num, totalInf));
                currentData.domI = Math.max(0, totalInf - currentData.intI);
            } else {
                currentData.domI = Math.max(0, Math.min(num, totalInf));
                currentData.intI = Math.max(0, totalInf - currentData.domI);
            }
        } else if (source === 'INT') {
            if (cls === 'J') {
                const maxJ = Math.min(currentData.jngJ, currentData.totalIntPax);
                currentData.intJ = Math.max(0, Math.min(num, maxJ));
                currentData.domJ = Math.max(0, currentData.jngJ - currentData.intJ);
                currentData.intY = Math.max(0, currentData.totalIntPax - currentData.intJ);
                currentData.domY = Math.max(0, currentData.totalDomPax - currentData.domJ);
            } else if (cls === 'Y') {
                const maxJ = Math.min(currentData.jngJ, currentData.totalIntPax);
                let targetJ = currentData.totalIntPax - num;
                currentData.intJ = Math.max(0, Math.min(targetJ, maxJ));
                currentData.domJ = Math.max(0, currentData.jngJ - currentData.intJ);
                currentData.intY = Math.max(0, currentData.totalIntPax - currentData.intJ);
                currentData.domY = Math.max(0, currentData.totalDomPax - currentData.domJ);
            }
        } else if (source === 'DOM') {
            if (cls === 'J') {
                const maxJ = Math.min(currentData.jngJ, currentData.totalDomPax);
                currentData.domJ = Math.max(0, Math.min(num, maxJ));
                currentData.intJ = Math.max(0, currentData.jngJ - currentData.domJ);
                currentData.domY = Math.max(0, currentData.totalDomPax - currentData.domJ);
                currentData.intY = Math.max(0, currentData.totalIntPax - currentData.intJ);
            } else if (cls === 'Y') {
                const maxJ = Math.min(currentData.jngJ, currentData.totalDomPax);
                let targetJ = currentData.totalDomPax - num;
                currentData.domJ = Math.max(0, Math.min(targetJ, maxJ));
                currentData.intJ = Math.max(0, currentData.jngJ - currentData.domJ);
                currentData.domY = Math.max(0, currentData.totalDomPax - currentData.domJ);
                currentData.intY = Math.max(0, currentData.totalIntPax - currentData.intJ);
            }
        }

        syncLiveInputFields();
        updateDisplay();
    }

    function updateDisplay() {
        let outputLines = [
            `PLA/PLU/PLUN:${currentData.pla}/${currentData.plu}/${currentData.plun}`,
            `TTL PAX: ${pad(currentData.ttlJ)}/${pad(currentData.ttlY)}+${pad(currentData.ttlI)}`,
            `DTR PAX: ${pad(currentData.dtrJ)}/${pad(currentData.dtrY)}+${pad(currentData.dtrI)}`
        ];

        if (currentData.isEvenFlight) {
            outputLines.push(`JNG INT: ${pad(currentData.intJ)}/${pad(currentData.intY)}+${pad(currentData.intI)}`);
            outputLines.push(`JNG DOM: ${pad(currentData.domJ)}/${pad(currentData.domY)}+${pad(currentData.domI)}`);
        } else {
            outputLines.push(`JNG PAX: ${pad(currentData.jngJ)}/${pad(currentData.jngY)}+${pad(currentData.jngI)}`);
        }

        outputLines.push(`DTR C/S/M: ${pad(currentData.dtrC)}/00/00`);
        outputLines.push(`JNG C/S/M: ${pad(currentData.jngC)}/00/00`);
        outputLines.push(`EBC: NIL`);

        const out = document.getElementById('output');
        out.innerText = outputLines.join('\n');
        out.style.display = 'block';
    }
</script>

</body>
</html>
