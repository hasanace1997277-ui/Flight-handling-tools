<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FR24 Flight History Parser (ATD 0000)</title>
<style>
  * {
    box-sizing: border-box;
    font-family: "Courier New", Courier, monospace;
  }
  body {
    margin: 0;
    padding: 8px;
    background-color: #d4d0c8;
    color: #000000;
    font-size: 13px;
  }
  .window {
    border: 2px solid #000000;
    background-color: #ffffff;
    max-width: 1100px;
    margin: 0 auto;
  }
  .title-bar {
    background-color: #000000;
    color: #ffff00;
    padding: 5px 8px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
  }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
  }
  .panel {
    border: 1px solid #000000;
    padding: 6px;
    background-color: #f4f4f0;
  }
  .controls {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  label {
    font-weight: bold;
  }
  input[type="text"] {
    border: 1px solid #000000;
    padding: 4px 6px;
    width: 110px;
    font-weight: bold;
    background: #ffffcc;
    text-transform: uppercase;
  }
  button {
    background-color: #ffff00;
    color: #000000;
    border: 2px solid #000000;
    padding: 4px 10px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active {
    background-color: #000000;
    color: #ffff00;
  }
  button.secondary {
    background-color: #e0e0e0;
  }
  textarea {
    width: 100%;
    height: 360px;
    border: 1px solid #000000;
    padding: 6px;
    resize: vertical;
    font-size: 12px;
    background: #ffffff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    font-size: 12px;
  }
  th, td {
    border: 1px solid #000000;
    padding: 4px 6px;
    text-align: left;
  }
  th {
    background-color: #000000;
    color: #ffff00;
  }
  tr:nth-child(even) {
    background-color: #f9f9f2;
  }
  .status {
    font-weight: bold;
    color: #006600;
    margin-left: auto;
  }
</style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span>FR24 FLIGHT HISTORY EXTRACTOR (ATD 0000)</span>
    <span id="rowCount">0 ROWS</span>
  </div>

  <div class="grid">
    <!-- Left Panel: Input -->
    <div class="panel">
      <div class="controls">
        <label for="flightNo">FLIGHT NO:</label>
        <input type="text" id="flightNo" value="OV404" placeholder="e.g. OV404">
        <button onclick="parseData()">EXTRACT</button>
        <button class="secondary" onclick="clearInput()">CLEAR</button>
      </div>
      <textarea id="rawInput" placeholder="Paste copied Flightradar24 flight history text here..."></textarea>
    </div>

    <!-- Right Panel: Output Table -->
    <div class="panel">
      <div class="controls">
        <button onclick="copyTableTSV()">COPY FOR EXCEL (TSV)</button>
        <button class="secondary" onclick="copyTableCSV()">COPY CSV</button>
        <span class="status" id="copyStatus"></span>
      </div>
      <div style="overflow-x: auto; max-height: 360px;">
        <table id="outputTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Flight No</th>
              <th>Reg</th>
              <th>ATD</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const sampleData = `22 Nov 2026
From: BangladeshChittagongCGPVGEG
To: OmanMuscatMCTOOMS
Aircraft:
A21N
A4O-OXG
Flight time: 4h 39minSTD: 10:55 PMATD: 10:35 PMSTA: 2:10 AM
Landed 1:14 AM
Play 22 Nov 2026
20 Nov 2026
From: BangladeshChittagongCGPVGEG
To: OmanMuscatMCTOOMS
Aircraft:
A21N
A4O-OXE
Flight time: 4h 38minSTD: 10:55 PMATD: 11:16 PMSTA: 2:10 AM
Landed 1:54 AM
Play 20 Nov 2026
19 Nov 2026
From: BangladeshChittagongCGPVGEG
To: OmanMuscatMCTOOMS
Aircraft:
A20N
A4O-OVG
Flight time: 4h 38minSTD: 11:15 PMATD: 11:25 PMSTA: 2:30 AM
Landed 2:04 AM
Play 19 Nov 2026
16 Nov 2026
From: BangladeshChittagongCGPVGEG
To: OmanMuscatMCTOOMS
Aircraft:
A20N
A4O-OVJ
Flight time: 4h 52minSTD: 10:55 PMATD: 10:24 PMSTA: 2:10 AM
Landed 1:17 AM
Play 16 Nov 2026`;

let extractedRows = [];

function parseDateToTimestamp(dateStr) {
  const parsed = Date.parse(dateStr);
  return isNaN(parsed) ? 0 : parsed;
}

// Extract and convert ATD time directly from block text into 4-digit "0000" format
function extractATD0000(text) {
  const match = text.match(/ATD:\s*(\d{1,2})\s*:\s*(\d{2})\s*(AM|PM)/i);
  if (!match) return "—";

  let hour = parseInt(match[1], 10);
  const minute = match[2].padStart(2, "0");
  const meridiem = match[3].toUpperCase();

  if (hour < 1 || hour > 12) return "—";

  if (meridiem === "AM") {
    hour = (hour === 12) ? 0 : hour;
  } else if (meridiem === "PM") {
    hour = (hour === 12) ? 12 : hour + 12;
  }

  return String(hour).padStart(2, "0") + minute;
}

// Extract aircraft registration from block lines
function extractRegistration(blockLines, joinedText) {
  const aircraftTypes = new Set([
    "32N", "32Q", "A20N", "A21N", "A319", "A320", "A321", "A332", "A333", "A339", "A359",
    "B737", "B738", "B739", "B38M", "B772", "B773", "B77W", "B788", "B789", "DH8D", "AT76"
  ]);

  const hyphenMatch = joinedText.match(/\b([A-Z0-9]{1,3}-[A-Z0-9]{2,5})\b/i);
  if (hyphenMatch) {
    return hyphenMatch[1].toUpperCase();
  }

  const acIndex = blockLines.findIndex(line => /^Aircraft:?$/i.test(line));
  if (acIndex !== -1) {
    for (let i = acIndex + 1; i < Math.min(blockLines.length, acIndex + 4); i++) {
      const candidate = blockLines[i].trim().toUpperCase();
      if (!candidate || aircraftTypes.has(candidate) || candidate.startsWith("FLIGHT TIME")) {
        continue;
      }
      const tokenMatch = candidate.match(/^([A-Z0-9-]{3,8})$/);
      if (tokenMatch && !/^\d+$/.test(tokenMatch[1])) {
        return tokenMatch[1];
      }
    }
  }

  return "—";
}

function parseData() {
  const raw = document.getElementById("rawInput").value;
  const defaultFlightNo = document.getElementById("flightNo").value.trim().toUpperCase() || "N/A";
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  extractedRows = [];

  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const blocks = [];
  let currentBlock = null;
  const dateHeaderRegex = /^(\d{1,2}\s+[A-Za-z]{3}\s+\d{4})$/;

  for (const line of lines) {
    if (dateHeaderRegex.test(line)) {
      if (currentBlock) blocks.push(currentBlock);
      currentBlock = { date: line, lines: [] };
    } else if (currentBlock) {
      currentBlock.lines.push(line);
    }
  }
  if (currentBlock) blocks.push(currentBlock);

  for (const block of blocks) {
    const joined = block.lines.join(" ");

    const flightMatch = joined.match(/\b([A-Z]{2}\s?\d{2,4})\b/);
    const flightNo = flightMatch ? flightMatch[1].replace(/\s+/g, "").toUpperCase() : defaultFlightNo;

    const reg = extractRegistration(block.lines, joined);
    const atd = extractATD0000(joined);

    extractedRows.push({
      date: block.date,
      timestamp: parseDateToTimestamp(block.date),
      flightNo: flightNo,
      reg: reg,
      atd: atd
    });
  }

  extractedRows.sort((a, b) => a.timestamp - b.timestamp);

  for (const row of extractedRows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.date}</td>
      <td>${row.flightNo}</td>
      <td>${row.reg}</td>
      <td>${row.atd}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById("rowCount").textContent = `${extractedRows.length} ROWS`;
  document.getElementById("copyStatus").textContent = "";
}

function copyTableTSV() {
  if (!extractedRows.length) return;
  const header = ["Date", "Flight No", "Reg", "ATD"].join("\t");
  const body = extractedRows.map(r => [r.date, r.flightNo, r.reg, r.atd].join("\t")).join("\n");
  copyToClipboard(header + "\n" + body, "COPIED FOR EXCEL (TSV)!");
}

function copyTableCSV() {
  if (!extractedRows.length) return;
  const header = ["Date", "Flight No", "Reg", "ATD"].join(",");
  const body = extractedRows.map(r => `"${r.date}","${r.flightNo}","${r.reg}","${r.atd}"`).join("\n");
  copyToClipboard(header + "\n" + body, "COPIED CSV!");
}

function copyToClipboard(text, msg) {
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById("copyStatus").textContent = msg;
    setTimeout(() => { document.getElementById("copyStatus").textContent = ""; }, 2500);
  });
}

function clearInput() {
  document.getElementById("rawInput").value = "";
  document.getElementById("tableBody").innerHTML = "";
  document.getElementById("rowCount").textContent = "0 ROWS";
  extractedRows = [];
}

window.onload = () => {
  document.getElementById("rawInput").value = sampleData;
  parseData();
};
</script>
</body>
</html>
