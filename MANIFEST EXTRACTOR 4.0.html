<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Block Extractor & Sortable Manifest Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h2, h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        textarea {
            width: 100%;
            height: 320px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            background-color: #fff;
        }
        button, select {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            color: #fff;
            background-color: #007bff;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.btn-success {
            background-color: #28a745;
        }
        button.btn-success:hover {
            background-color: #218838;
        }
        button.btn-secondary {
            background-color: #6c757d;
        }
        button.btn-secondary:hover {
            background-color: #5a6268;
        }
        button.btn-info {
            background-color: #17a2b8;
        }
        button.btn-info:hover {
            background-color: #138496;
        }
        select.filter-select {
            background-color: #fff;
            color: #2c3e50;
            cursor: pointer;
            border: 1px solid #17a2b8;
        }
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls-header .button-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .collapsible-section {
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        /* Sortable Item Styling */
        .sortable-item {
            margin-bottom: 10px;
            border: 1px solid #007bff;
            border-radius: 4px;
            background-color: #f8f9fa;
            transition: transform 0.15s, opacity 0.15s;
        }
        .sortable-item.dragging {
            opacity: 0.4;
            border: 2px dashed #007bff;
        }
        .item-header {
            display: flex;
            align-items: center;
            background-color: #e9ecef;
            padding: 4px 10px;
            user-select: none;
        }
        .drag-handle {
            cursor: grab;
            font-size: 18px;
            color: #6c757d;
            padding: 0 10px 0 5px;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .move-btn {
            background: none;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 2px 8px;
            font-size: 12px;
            margin-right: 4px;
            border-radius: 3px;
            cursor: pointer;
        }
        .move-btn:hover {
            background-color: #dee2e6;
            color: #000;
        }
        .copy-block-btn {
            background-color: #17a2b8;
            color: #fff;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 3px;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .copy-block-btn:hover {
            background-color: #138496;
        }
        .delete-btn {
            background-color: #dc3545;
            color: #fff;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 3px;
            margin-left: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
        details {
            flex-grow: 1;
            background-color: transparent;
        }
        summary {
            padding: 8px 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #1b4965;
            outline: none;
        }
        summary:hover {
            color: #0056b3;
        }
        .block-container {
            position: relative;
        }
        .block-content {
            padding: 15px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            overflow-x: auto;
            user-select: text;
        }
        .count-badge {
            font-size: 12px;
            font-weight: normal;
            color: #6c757d;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <h2>Email Block Extractor</h2>
    
    <div class="container">
        <div class="box">
            <label for="inputText"><strong>Input Raw Emails Data:</strong></label>
            <textarea id="inputText" placeholder="Paste raw input here..."></textarea>
            <div style="margin-top: 10px;">
                <button onclick="processEmails()">Extract & Generate Views</button>
            </div>
        </div>
        <div class="box">
            <label for="outputText"><strong>Extracted Raw Blocks Output:</strong></label>
            <textarea id="outputText" readonly placeholder="Extracted text blocks will appear here..."></textarea>
        </div>
    </div>

    <!-- Collapsible & Sortable Section -->
    <div class="collapsible-section">
        <div class="controls-header">
            <h3>Sortable Manifest Blocks <span id="blockCount" class="count-badge"></span></h3>
            <div class="button-group">
                <!-- Date Filter Dropdown -->
                <select id="dateFilterSelect" class="filter-select" onchange="filterByDate()">
                    <option value="ALL">📅 Filter: All Dates</option>
                </select>
                <button class="btn-info" onclick="sortByManifestDate()">📅 Sort by Date</button>
                <button class="btn-success" onclick="generateSortedManifest()">⚡ Generate Sorted Manifest</button>
            </div>
        </div>
        <div id="collapsibleContainer">
            <p style="color: #6c757d; font-style: italic;">No blocks extracted yet. Paste raw email data above and click process.</p>
        </div>
    </div>

    <!-- Final Sorted Output Section -->
    <div class="collapsible-section">
        <div class="controls-header">
            <h3>Final Sorted Manifest Output</h3>
            <button class="btn-secondary" onclick="copySortedOutput()">📋 Copy Sorted Text</button>
        </div>
        <textarea id="sortedOutputText" style="height: 300px;" readonly placeholder="Click 'Generate Sorted Manifest' above to build the sorted compilation..."></textarea>
    </div>

    <script>
        const monthMap = {
            JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5,
            JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11
        };

        function processEmails() {
            let input = document.getElementById("inputText").value;

            // Clean "This message originated outside of your organization." line from anywhere in the input
            input = input.replace(/This message originated outside of your organization\.\r?\n?/gi, '');

            // 1. Clean Quoted-Printable artifacts
            input = input.replace(/=C2=A5/g, '');
            input = input.replace(/=\r?\n/g, '');

            // 2. Extract blocks starting from 'From: "Interact"' OR 'From: no-reply@sabre.com' down to '------=_Part'
            const regex = /From:\s*(?:"Interact"\s*<sabre\.ems@sabre\.com>|no-reply@sabre\.com)[\s\S]*?(?=\r?\n\s*------=_Part|$)/gi;
            const matches = input.match(regex);

            const outputText = document.getElementById("outputText");
            const collapsibleContainer = document.getElementById("collapsibleContainer");

            if (matches && matches.length > 0) {
                outputText.value = matches.map(m => m.trim()).join("\n\n" + "=".repeat(60) + "\n\n");
                
                collapsibleContainer.innerHTML = "";

                // 3. Process each match and build sortable elements
                matches.forEach((block, index) => {
                    const trimmedBlock = block.trim();
                    const manifestCode = extractManifestName(trimmedBlock);
                    const rawDateCode = extractRawDateCode(manifestCode);

                    const wrapper = document.createElement("div");
                    wrapper.className = "sortable-item";
                    wrapper.draggable = true;
                    wrapper.dataset.blockText = trimmedBlock;
                    wrapper.dataset.manifestTitle = manifestCode;
                    wrapper.dataset.dateCode = rawDateCode;

                    // Header control bar
                    const header = document.createElement("div");
                    header.className = "item-header";

                    const dragHandle = document.createElement("span");
                    dragHandle.className = "drag-handle";
                    dragHandle.innerHTML = "⣿";
                    dragHandle.title = "Drag to reorder";

                    const upBtn = document.createElement("button");
                    upBtn.className = "move-btn";
                    upBtn.innerHTML = "▲";
                    upBtn.title = "Move Up";
                    upBtn.onclick = (e) => { e.stopPropagation(); moveItem(wrapper, -1); };

                    const downBtn = document.createElement("button");
                    downBtn.className = "move-btn";
                    downBtn.innerHTML = "▼";
                    downBtn.title = "Move Down";
                    downBtn.onclick = (e) => { e.stopPropagation(); moveItem(wrapper, 1); };

                    const details = document.createElement("details");
                    if (index === 0) details.open = true;

                    const summary = document.createElement("summary");
                    summary.textContent = manifestCode;

                    const blockContainer = document.createElement("div");
                    blockContainer.className = "block-container";

                    const pre = document.createElement("pre");
                    pre.className = "block-content";
                    pre.textContent = trimmedBlock;

                    blockContainer.appendChild(pre);
                    details.appendChild(summary);
                    details.appendChild(blockContainer);

                    // Individual Copy Button
                    const copyBtn = document.createElement("button");
                    copyBtn.className = "copy-block-btn";
                    copyBtn.innerHTML = "📋 Copy";
                    copyBtn.title = "Copy block text to clipboard";
                    copyBtn.onclick = (e) => {
                        e.stopPropagation();
                        copySingleBlock(trimmedBlock, copyBtn);
                    };

                    // Delete Button
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.innerHTML = "🗑️ Delete";
                    deleteBtn.title = "Delete this block";
                    deleteBtn.onclick = (e) => { 
                        e.stopPropagation(); 
                        deleteBlock(wrapper, manifestCode); 
                    };

                    header.appendChild(dragHandle);
                    header.appendChild(upBtn);
                    header.appendChild(downBtn);
                    header.appendChild(details);
                    header.appendChild(copyBtn);
                    header.appendChild(deleteBtn);

                    wrapper.appendChild(header);
                    collapsibleContainer.appendChild(wrapper);

                    // Add Drag and Drop Listeners
                    addDragListeners(wrapper);
                });

                populateDateFilterDropdown();
                updateBlockCount();
                generateSortedManifest();

            } else {
                outputText.value = "No matching blocks found starting with 'From: \"Interact\" <sabre.ems@sabre.com>' or 'From: no-reply@sabre.com'.";
                collapsibleContainer.innerHTML = `<p style="color: #dc3545;">No matching manifest blocks detected.</p>`;
                document.getElementById("blockCount").textContent = "";
                document.getElementById("sortedOutputText").value = "";
                document.getElementById("dateFilterSelect").innerHTML = `<option value="ALL">📅 Filter: All Dates</option>`;
            }
        }

        // Single block copy function with feedback
        function copySingleBlock(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "✅ Copied!";
                btnElement.style.backgroundColor = "#28a745";
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.style.backgroundColor = "#17a2b8";
                }, 1500);
            }).catch(err => {
                alert("Failed to copy text: " + err);
            });
        }

        // Strict priority parsing logic
        function extractManifestName(text) {
            const isStandardHeaderLine = (line) => {
                return /^(From|To|Subject|MIME-Version|Content-Type|Content-Transfer-Encoding|Date|Message-ID):/i.test(line);
            };

            // PRIORITY 1: Search after 'Content-Transfer-Encoding:'
            const encodingIndex = text.search(/Content-Transfer-Encoding:/i);
            if (encodingIndex !== -1) {
                const subText = text.substring(encodingIndex);
                const lines = subText.split(/\r?\n/);
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0 && !isStandardHeaderLine(line)) {
                        return line;
                    }
                }
            }

            // PRIORITY 2: Search after 'Message-ID:'
            const msgIdIndex = text.search(/Message-ID:/i);
            if (msgIdIndex !== -1) {
                const subText = text.substring(msgIdIndex);
                const lines = subText.split(/\r?\n/);
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0 && !isStandardHeaderLine(line)) {
                        return line;
                    }
                }
            }

            // PRIORITY 3: Fallback regex pattern match
            const codeMatch = text.match(/\b([A-Z0-9\*]{2,8}\/[A-Z0-9\/]+)\b/i);
            if (codeMatch && codeMatch[1]) {
                return codeMatch[1].toUpperCase();
            }

            return "MANIFEST BLOCK";
        }

        // Extracts date code string like "19SEP" or "16SEP"
        function extractRawDateCode(title) {
            const match = title.match(/(\d{1,2})(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)/i);
            return match ? match[0].toUpperCase() : "NO_DATE";
        }

        // Parses date for relative timestamp ordering
        function parseDateFromTitle(title) {
            const match = title.match(/(\d{1,2})(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)/i);
            if (match) {
                const day = parseInt(match[1], 10);
                const month = monthMap[match[2].toUpperCase()];
                return new Date(2026, month, day).getTime();
            }
            return Infinity;
        }

        // Populate dropdown with extracted dates
        function populateDateFilterDropdown() {
            const items = document.querySelectorAll('.sortable-item');
            const select = document.getElementById('dateFilterSelect');
            const datesSet = new Set();

            items.forEach(item => {
                const dateCode = item.dataset.dateCode;
                if (dateCode && dateCode !== "NO_DATE") {
                    datesSet.add(dateCode);
                }
            });

            const currentSelected = select.value;
            select.innerHTML = `<option value="ALL">📅 Filter: All Dates</option>`;

            Array.from(datesSet).sort((a, b) => {
                return parseDateFromTitle(a) - parseDateFromTitle(b);
            }).forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = `📅 Show ${date} Only`;
                select.appendChild(option);
            });

            if (datesSet.has(currentSelected)) {
                select.value = currentSelected;
            } else {
                select.value = "ALL";
            }
        }

        // Filter block display by selected date
        function filterByDate() {
            const selectedDate = document.getElementById('dateFilterSelect').value;
            const items = document.querySelectorAll('.sortable-item');

            items.forEach(item => {
                if (selectedDate === "ALL" || item.dataset.dateCode === selectedDate) {
                    item.style.display = "";
                } else {
                    item.style.display = "none";
                }
            });

            updateBlockCount();
            generateSortedManifest();
        }

        // Sort items in the DOM chronologically by date
        function sortByManifestDate() {
            const container = document.getElementById('collapsibleContainer');
            const items = Array.from(container.querySelectorAll('.sortable-item'));

            if (items.length === 0) return;

            items.sort((a, b) => {
                const dateA = parseDateFromTitle(a.dataset.manifestTitle || "");
                const dateB = parseDateFromTitle(b.dataset.manifestTitle || "");
                return dateA - dateB;
            });

            container.innerHTML = "";
            items.forEach(item => container.appendChild(item));

            populateDateFilterDropdown();
            filterByDate();
        }

        // Delete block logic
        function deleteBlock(item, blockTitle) {
            if (confirm(`Are you sure you want to delete "${blockTitle}"?`)) {
                item.remove();
                populateDateFilterDropdown();
                filterByDate();
            }
        }

        // Helper to update counter badge dynamically
        function updateBlockCount() {
            const items = document.querySelectorAll('.sortable-item');
            const visibleItems = document.querySelectorAll('.sortable-item:not([style*="display: none"])');
            const blockCountBadge = document.getElementById("blockCount");
            const collapsibleContainer = document.getElementById("collapsibleContainer");

            if (items.length > 0) {
                blockCountBadge.textContent = `(Showing ${visibleItems.length} of ${items.length} block${items.length > 1 ? 's' : ''})`;
            } else {
                blockCountBadge.textContent = "(0 blocks)";
                collapsibleContainer.innerHTML = `<p style="color: #6c757d; font-style: italic;">All blocks deleted. Paste raw email data above to process again.</p>`;
            }
        }

        // Drag and Drop implementation
        function addDragListeners(item) {
            item.addEventListener('dragstart', (e) => {
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
            });
        }

        const container = document.getElementById('collapsibleContainer');
        container.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            if (!draggingItem) return;

            const siblings = [...container.querySelectorAll('.sortable-item:not(.dragging)')];
            const nextSibling = siblings.find(sibling => {
                const box = sibling.getBoundingClientRect();
                return e.clientY <= box.top + box.height / 2;
            });

            container.insertBefore(draggingItem, nextSibling);
        });

        // Up/Down button movement fallback
        function moveItem(item, direction) {
            if (direction === -1 && item.previousElementSibling) {
                item.parentNode.insertBefore(item, item.previousElementSibling);
            } else if (direction === 1 && item.nextElementSibling) {
                item.parentNode.insertBefore(item.nextElementSibling, item);
            }
            generateSortedManifest();
        }

        // Generate combined sorted manifest output (incorporating filters)
        function generateSortedManifest() {
            const visibleItems = document.querySelectorAll('.sortable-item:not([style*="display: none"])');
            if (visibleItems.length === 0) {
                document.getElementById('sortedOutputText').value = "";
                return;
            }

            const sortedTexts = Array.from(visibleItems).map(item => item.dataset.blockText);
            document.getElementById('sortedOutputText').value = sortedTexts.join("\n\n" + "=".repeat(60) + "\n\n");
        }

        // Helper to copy final text
        function copySortedOutput() {
            const sortedText = document.getElementById('sortedOutputText');
            if (!sortedText.value) return;
            sortedText.select();
            navigator.clipboard.writeText(sortedText.value);
            alert("Sorted manifest output copied to clipboard!");
        }
    </script>

</body>
</html>
